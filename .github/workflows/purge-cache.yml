name: Purge Cloudflare cache

# 手动触发：按 URL 精确清理边缘缓存。
# 用途：删除验证文件等静态资源后，部署已移除文件，但边缘缓存仍会保留旧响应
# （静态资源默认 s-maxage=604800），需要按 URL 主动清理。
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "要清理的完整 URL，逗号分隔"
        required: true
        type: string

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: 调用 Cloudflare 清理接口
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # dshcrate.com 的 Zone ID，不是密钥
          ZONE_ID: 5d361be0de06ad6ddfd6bac4dec30752
          URLS: ${{ inputs.urls }}
        run: |
          node -e '
            (async () => {
              const files = process.env.URLS.split(",").map((item) => item.trim()).filter(Boolean);
              if (files.length === 0) {
                console.error("没有可清理的 URL");
                process.exit(1);
              }
              const response = await fetch(
                `https://api.cloudflare.com/client/v4/zones/${process.env.ZONE_ID}/purge_cache`,
                {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
                    "content-type": "application/json",
                  },
                  body: JSON.stringify({ files }),
                },
              );
              console.log(`purge ${response.status}: ${await response.text()}`);
              if (!response.ok) process.exit(1);
            })();
          '
